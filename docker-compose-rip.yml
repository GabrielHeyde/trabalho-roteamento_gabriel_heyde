services:
  r1:
    image: frrouting/frr:latest
    container_name: R1
    hostname: R1
    privileged: true
    sysctls:
      - net.ipv4.ip_forward=1
    volumes:
      - ./configs/rip/R1/daemons:/etc/frr/daemons
      - ./configs/rip/R1/frr.conf:/etc/frr/frr.conf
    networks:
      r1_r2:
        ipv4_address: 10.0.12.2
      r1_r3:
        ipv4_address: 10.0.13.2
      lan_r1:
        ipv4_address: 192.168.1.2

  r2:
    image: frrouting/frr:latest
    container_name: R2
    hostname: R2
    privileged: true
    sysctls:
      - net.ipv4.ip_forward=1
    volumes:
      - ./configs/rip/R2/daemons:/etc/frr/daemons
      - ./configs/rip/R2/frr.conf:/etc/frr/frr.conf
    networks:
      r1_r2:
        ipv4_address: 10.0.12.3
      r2_r4:
        ipv4_address: 10.0.24.2
      lan_r2:
        ipv4_address: 192.168.2.2

  r3:
    image: frrouting/frr:latest
    container_name: R3
    hostname: R3
    privileged: true
    sysctls:
      - net.ipv4.ip_forward=1
    volumes:
      - ./configs/rip/R3/daemons:/etc/frr/daemons
      - ./configs/rip/R3/frr.conf:/etc/frr/frr.conf
    networks:
      r1_r3:
        ipv4_address: 10.0.13.3
      r3_r4:
        ipv4_address: 10.0.34.2
      r3_r5:
        ipv4_address: 10.0.35.2
      lan_r3:
        ipv4_address: 192.168.3.2

  r4:
    image: frrouting/frr:latest
    container_name: R4
    hostname: R4
    privileged: true
    sysctls:
      - net.ipv4.ip_forward=1
    volumes:
      - ./configs/rip/R4/daemons:/etc/frr/daemons
      - ./configs/rip/R4/frr.conf:/etc/frr/frr.conf
    networks:
      r2_r4:
        ipv4_address: 10.0.24.3
      r3_r4:
        ipv4_address: 10.0.34.3
      r4_r5:
        ipv4_address: 10.0.45.2
      lan_r4:
        ipv4_address: 192.168.4.2

  r5:
    image: frrouting/frr:latest
    container_name: R5
    hostname: R5
    privileged: true
    sysctls:
      - net.ipv4.ip_forward=1
    volumes:
      - ./configs/rip/R5/daemons:/etc/frr/daemons
      - ./configs/rip/R5/frr.conf:/etc/frr/frr.conf
    networks:
      r3_r5:
        ipv4_address: 10.0.35.3
      r4_r5:
        ipv4_address: 10.0.45.3
      lan_r5:
        ipv4_address: 192.168.5.2

networks:
  r1_r2:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.12.0/29
          gateway: 10.0.12.1

  r1_r3:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.13.0/29
          gateway: 10.0.13.1

  r2_r4:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.24.0/29
          gateway: 10.0.24.1

  r3_r4:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.34.0/29
          gateway: 10.0.34.1

  r3_r5:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.35.0/29
          gateway: 10.0.35.1

  r4_r5:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.45.0/29
          gateway: 10.0.45.1

  lan_r1:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.1.0/24
          gateway: 192.168.1.1

  lan_r2:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.2.0/24
          gateway: 192.168.2.1

  lan_r3:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.3.0/24
          gateway: 192.168.3.1

  lan_r4:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.4.0/24
          gateway: 192.168.4.1

  lan_r5:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.5.0/24
          gateway: 192.168.5.1
